name: company-brain

services:
  api:
    build: ./server
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Copy .env.example to .env and set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=8).close()"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  mariadb-data:
